    scenarios:
      - id: S1
        goal: "I want to write a .semolina.toml for my Snowflake warehouse and get a registered engine my application code can query"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Configuring warehouse connections via TOML is the first thing I do; nothing else I own can be exposed to the frontend team until the connection is described in a committed config file."
        done_when: "I have a complete [connections.default] section with every field my warehouse needs, I know how create_engine() selects the section and where it looks for the file, and I know what register() does to make a query resolve it."
      - id: S2
        goal: "I want to run semolina codegen against my existing Snowflake semantic views and get typed model classes, including getting the credentials right"
        starting_point: "docs/src/index.rst"
        persona_relevance: "I already own dozens of semantic views. Hand-transcribing them into Python is exactly the work I am trying to avoid, and the CLI's credential resolution is the first thing that will bite me because it is not the same as my application's."
        done_when: "I know the exact command, which TOML section and environment variables the CLI reads (and how that differs from create_engine), how to save the output, and how to tell CI when a committed model has drifted."
      - id: S3
        goal: "I want to build a query endpoint that takes a filter from the frontend's query string and returns metric data as JSON with stable field names and sane HTTP status codes"
        starting_point: "docs/src/index.rst"
        persona_relevance: "My job is serving the semantic layer to a frontend team without them writing SQL. I have never written a REST endpoint, so I need the whole handler, not just the Semolina call inside it."
        done_when: "I have complete runnable endpoint code covering engine startup/shutdown, an optional filter parameter, a response shape with my own field names, and a mapping from warehouse failure to an HTTP status code."
      - id: S4
        goal: "I want to size and manage connection pools so the API survives concurrent dashboard traffic in production"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Concurrency is where a data-platform service falls over. I have never tuned a connection pool, so I need to know what it is, what the numbers mean for my traffic, and how the pool opens and closes around the service."
        done_when: "I understand what the pool is doing and why a service needs one, how to choose pool_size and max_overflow for expected load, how to set them from the TOML file I already wrote, and how to build and dispose the engine at startup and shutdown."
      - id: S5
        goal: "I run Databricks only. I want to install what Semolina needs, configure my metric view connection, and know the Databricks-specific behaviour, without reading Snowflake material"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Our platform is Databricks. A page that merges three warehouses is only useful to me if I can pick mine once and read a coherent Databricks story end to end."
        done_when: "I have installed everything required to open a Databricks connection, have a valid [connections.databricks] section, and know the Databricks-specific behaviours (MEASURE, Unity Catalog naming, result column spellings) without being blocked by an unexplained prerequisite."
  - name: "Python web developers building analytics backends"
    skill_level: "advanced"
    generated_at: "2026-09-05"
    doc_pages:
