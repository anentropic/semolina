    scenarios:
      - id: S1
        goal: "I want to install Semolina with the Snowflake backend, configure a .semolina.toml connection, define a model, and execute my first query end-to-end"
        starting_point: "docs/src/index.rst"
        persona_relevance: "As a web developer building an analytics backend, the very first thing I need is to get the library running and see a query execute against my Snowflake warehouse -- installation through first result"
        done_when: "I have a clear, unbroken path from pip install through TOML configuration to executing a query and reading results, with no missing steps or unexplained concepts"
      - id: S2
        goal: "I want to build a FastAPI endpoint that accepts filter parameters from the frontend and returns filtered, ordered, paginated metric data as JSON, mapping warehouse failures onto HTTP status codes"
        starting_point: "docs/src/index.rst"
        persona_relevance: "My core job is building API endpoints that serve analytics data to frontend dashboards -- I need to translate request parameters into Semolina queries dynamically, return correct status codes when the warehouse misbehaves, and serialize results to JSON"
        done_when: "I have a complete FastAPI endpoint pattern covering dynamic filters from query params, ordering, limiting/pagination, an exception taxonomy I can map to 4xx/5xx, and JSON serialization that survives real warehouse types"
      - id: S3
        goal: "I want to deploy a Semolina-backed FastAPI service behind async handlers: async engine lifecycle, pool sizing for concurrency, timeouts, and cancellation"
        starting_point: "docs/src/index.rst"
        persona_relevance: "My service runs async under uvicorn and must not stall the event loop or leak pooled connections; I need to know the async entry points, how concurrency is bounded, and what happens when a request is cancelled or times out"
        done_when: "I know which extra to install, how to build/register/dispose an async engine in a lifespan handler, how pool sizing bounds concurrency, how to apply a deadline, and what cancellation does to the connection and the warehouse query"
      - id: S4
        goal: "I want to understand what semantic views are and how Semolina's Metric/Dimension/Fact fields map to my warehouse's semantic layer definitions, including AGG vs MEASURE"
        starting_point: "docs/src/index.rst"
        persona_relevance: "As a web developer, I know SQL and ORMs but I have never worked with semantic views -- I need to understand the domain concepts before I can model them correctly in my application"
        done_when: "I understand what a semantic view is, how Snowflake and Databricks implement them differently, what AGG vs MEASURE means, and how Metric/Dimension/Fact map to warehouse columns"
      - id: S5
        goal: "I want to generate Python model classes from my existing Snowflake semantic views using the codegen CLI and understand the output"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Our data team already has semantic views defined in Snowflake -- I want to auto-generate matching Python models rather than manually transcribe dozens of views, and I need to know how to configure credentials"
        done_when: "I know the exact CLI command, how to set up credentials (env vars or .env file), what the generated output looks like, how to handle edge cases (TODO comments, non-standard types), and how to pipe output to a file"
      - id: S6
        goal: "I want to go from a query I already wrote to a typed row object returned from a FastAPI endpoint: generate a result DTO with semolina codegen-dto, commit it, and hand it to .into() inside a handler"
        starting_point: "docs/src/index.rst"
        persona_relevance: "This is the exact shape of my job -- the JSON body my dashboard consumes should be a typed object with stable field names, not the warehouse's raw column spellings. I need to know which of the three codegen-dto routes to use, where the generated file lives, what it needs at runtime, and whether the generated class is safe to use as a FastAPI response model"
        done_when: "I can pick a generation route, run the command against my backend with the right credentials, understand the generated class (aliases, optional metrics, Any/TODO fields), install whatever .into() needs, and return the instances from an endpoint without guessing at anything load-bearing"
