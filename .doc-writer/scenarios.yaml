      - "how-to/streaming.rst"
      - "how-to/web-api.rst"
      - "how-to/codegen.rst"
      - "how-to/dto-codegen.rst"
      - "how-to/codegen-credentials.rst"
      - "how-to/warehouse-testing.rst"
      - "reference/index.rst"
      - "reference/config.rst"
      - "reference/cli.rst"
      - "explanation/index.rst"
      - "explanation/semantic-views.rst"
      - "explanation/type-fidelity.rst"
      - "explanation/duckdb-vs-warehouse.rst"
    scenarios:
      - id: S1
        goal: "I want to go from nothing to a running FastAPI service that answers GET /revenue with a typed JSON body, and then point that same service at my company's Snowflake warehouse via .semolina.toml"
        starting_point: "docs/src/index.rst"
        persona_relevance: "This is the whole reason I found the library: a Python backend that serves semantic-layer numbers to a dashboard. I need install, connection config, model definition, query, and HTTP serialization to form one unbroken path, and I need to know what changes when the warehouse underneath is Snowflake rather than a local file."
        done_when: "I can run a FastAPI app that returns JSON from a semantic view, and I know exactly which lines change (config, DTO aliases, annotations, pool size) to run the same code against Snowflake."
      - id: S2
        goal: "I want to translate frontend query parameters into filters, sorting and pagination on a Semolina query, and map warehouse failures onto HTTP status codes"
        starting_point: "docs/src/index.rst"
        persona_relevance: "A dashboard endpoint is mostly parameter plumbing: optional filters, a sort key the client chooses, a page of rows, and a sane status code when the warehouse misbehaves. I need the operator set, the safe way to accept a caller-chosen sort, a pagination story, and an exception taxonomy."
        done_when: "I know every filter operator and how a request value reaches the warehouse, how to accept a sort parameter without letting it build SQL, how to page a result, and which exception classes map to which status codes -- including the one that never reaches the driver."
      - id: S3
        goal: "I want to run this service under async handlers on uvicorn: async engine lifecycle in a lifespan, pool sizing that bounds concurrency, a per-request deadline, and correct behaviour when a client disconnects"
        starting_point: "docs/src/index.rst"
        persona_relevance: "My service is async and runs behind uvicorn with real concurrency. I need to know which extra to install, that the async engine is a separate type with a separate registry, how many queries can be in flight, and what a timeout or disconnect does to the pooled connection and to the warehouse query I am being billed for."
        done_when: "I can write an async lifespan and handler, size the pool for my expected concurrency, apply a deadline, handle a disconnect, and know that neither leaks a connection."
      - id: S4
        goal: "I want to understand what a semantic view actually is, why I cannot SELECT a metric like a column, and how Metric/Dimension/Fact map onto AGG() and MEASURE() -- arriving from a search engine partway into the docs rather than at the front page"
        starting_point: "docs/src/how-to/backends.rst (search landing), then docs/src/index.rst"
        persona_relevance: "I know SQL and ORMs cold and have never touched a semantic layer. Before I model anything I need the domain concept, the per-warehouse spelling difference, and the mapping from Semolina's field types to what the warehouse computes. I got here from a search result, not from the front page."
        done_when: "I can explain what a semantic view is, why revenue is a definition rather than a column, how Snowflake, Databricks and DuckDB each ask for a metric, and which Semolina field type corresponds to which role -- and I could orient myself from the page I landed on."
      - id: S5
        goal: "I want to stop hand-writing models and response classes: generate the SemanticView model and the Pydantic result DTO from my Snowflake views, commit both, use them in my endpoint and my tests, and fail CI when the warehouse drifts"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Our data team owns dozens of views and changes them without telling me. Hand-transcribed models go stale silently, and the warehouse's column spellings do not belong in my JSON contract. I need generation, the credentials chain, and a drift check I can wire into CI."
        done_when: "I know both commands and their credential rules, what the generated classes contain (aliases, optional metrics, TODO annotations), how to commit them, how to use them from a handler and a test, and how --check behaves in CI."
