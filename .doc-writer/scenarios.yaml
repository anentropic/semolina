    scenarios:
      - id: S1
        goal: "I want to configure a .semolina.toml file and connect to my Snowflake warehouse with create_engine()"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Configuring warehouse connections via TOML is my first step before I can expose anything to the frontend team. I need the exact TOML fields, how create_engine() reads them, and how register() makes the engine available."
        done_when: "I have a complete .semolina.toml for Snowflake with every required field, I know how create_engine() selects a section, and I know how to call register() so a query resolves it."
      - id: S2
        goal: "I want to use semolina codegen to generate SemanticView model classes from my existing Snowflake semantic views"
        starting_point: "docs/src/index.rst"
        persona_relevance: "I already have semantic views in my warehouse. I need typed Python models generated from them rather than hand-transcribing dozens of views."
        done_when: "I know the exact command, which credentials and TOML section it reads, what the generated output looks like, and how to save it to a file."
      - id: S3
        goal: "I want to generate a typed result DTO for one of my views with semolina codegen-dto --view, without first writing a model class or a query module"
        starting_point: "docs/src/index.rst"
        persona_relevance: "I own the warehouse, not the application code. Writing a SemanticView class and a module-level fluent query first is exactly the ORM-shaped work I was hoping to skip, so the --view shortcut is the route built for me. I need it to be findable and I need to know its limits."
        done_when: "I can find the --view route, run it against my view, understand the class it produces, and know what the route cannot do -- including what happens when a warehouse field name is not a valid Python identifier, and what I still have to write to actually use the generated class."
      - id: S4
        goal: "I want to declare all of my project's DTOs in pyproject.toml so regenerating them is one repeatable command"
        starting_point: "docs/src/index.rst"
        persona_relevance: "A command line nobody remembers between releases is not a pipeline step. I need the DTO set written down in a committed file so regeneration after a semantic layer change is reproducible for the whole team."
        done_when: "I can write a complete [tool.semolina.dto] section covering both entry shapes, know how paths and credentials resolve, know which flags override the file, and know how to keep the committed output current."
      - id: S5
        goal: "I want to build a query endpoint that accepts filter parameters from the frontend and returns filtered metric data as JSON"
        starting_point: "docs/src/index.rst"
        persona_relevance: "My job is exposing semantic layer data to the frontend team. I need to turn request parameters into Semolina queries and return something the frontend can consume, without inventing REST plumbing I have never written before."
        done_when: "I have complete endpoint code showing conditional filters, limits, execution, JSON serialization of warehouse types, and error handling I can map to status codes."
      - id: S6
        goal: "I want to set up connection pooling for production so my API can serve concurrent frontend requests"
        starting_point: "docs/src/index.rst"
        persona_relevance: "In production my API serves many dashboard users at once. I need to understand what the pool is doing, how to size it, and how to open and close it around application startup and shutdown."
        done_when: "I understand what a connection pool is and why it matters here, how to set pool_size and max_overflow for my expected load, and how to build and dispose the engine at application startup and shutdown."
