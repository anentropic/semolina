proper_nouns:
  - canonical: "Snowflake"
    variants: []
  - canonical: "Databricks"
    variants: []
  - canonical: "DuckDB"
    variants: []
  - canonical: "Python"
    variants: []
  - canonical: "Semolina"
    variants: []
  - canonical: "Unity Catalog"
    variants: []
  - canonical: "FastAPI"
    variants: []
  - canonical: "Starlette"
    variants: []
  - canonical: "PyArrow"
    variants: ["pyarrow"]
    note: >-
      "PyArrow" in prose (the project's own capitalization); ``pyarrow``
      in code, module paths, and extra names.
  - canonical: "polars"
    variants: ["Polars"]
    note: "Lowercase, matching the project's own branding. Applies in prose and code."
  - canonical: "pandas"
    variants: ["Pandas"]
    note: "Lowercase, matching the project's own branding. Applies in prose and code."
  - canonical: "Pydantic"
    variants: []
    note: "``pydantic`` when naming the module or a symbol path."
  - canonical: "Arrow"
    variants: []
    note: "The format. 'PyArrow' is the Python library."

project_terms:
  - canonical: "semantic view"
    variants: ["Semantic View", "Semantic Views"]
    note: "Snowflake and DuckDB. Never used for Databricks."
  - canonical: "metric view"
    variants: ["Metric View", "Metric Views"]
    note: "Databricks only."
  - canonical: "engine"
    variants: []
    note: >-
      The top-level object a user builds and registers. It owns one ADBC pool
      plus a dialect. Prefer "engine" over "pool" or "connection" when naming
      the thing the reader holds. `_Query.using()`'s parameter is still spelled
      `pool_name` in source; the docs deliberately say "engine name".
  - canonical: "connection pool"
    variants: ["connection-pool", "pool"]
    note: >-
      Use only for the thing an engine owns. "Size the pool", "pooled
      connection" are fine; "register a pool" is not (you register an engine).
  - canonical: "measure"
    variants: []
    note: >-
      The warehouse-side concept (Snowflake METRICS clause, Databricks
      `measures:`). The Semolina field type is `Metric`. Do not use "measure"
      for the Python field.
  - canonical: "model"
    variants: []
    note: "A SemanticView subclass. Not a 'DTO'."
  - canonical: "DTO"
    variants: []
    note: >-
      The Pydantic BaseModel a result is converted into via `into()`. Kept
      distinct from "model" on purpose.
  - canonical: ".semolina.toml"
    variants: ["semolina.toml"]
  - canonical: "adbc-poolhouse"
    variants: ["ADBC poolhouse", "adbc poolhouse"]
  - canonical: "order term"
    variants: []
    note: "Prose form; `OrderTerm` in code references."

spelling:
  # Oxford spelling: -ize verbs, -our nouns. Both were mixed before v2.
  - rule: "-ize"
    examples: ["serialize", "materialize", "normalize", "specialized", "recognize"]
    rejected: ["serialise", "materialise", "normalise", "specialised", "recognise"]
  - rule: "-our"
    examples: ["behaviour"]
    rejected: ["behavior"]

overrides: {}
