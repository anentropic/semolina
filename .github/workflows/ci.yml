name: CI

on:
  # Branch pushes are covered by the pull_request trigger, so main is the only branch
  # needing a push run of its own. Until 2026-09-07 this was `branches: "**"` with no
  # pull_request trigger at all, which meant PRs from forks never ran CI here and the
  # coverage comment step below — gated on `github.event_name == 'pull_request'` — could
  # never fire (REL-03).
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
  # Lets release.yml run this exact workflow against the tagged commit before publishing,
  # rather than trusting that some earlier run of it happened to be green (REL-02).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check with basedpyright
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --locked --dev --extra all

      - name: Run basedpyright
        run: uv run basedpyright

  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --locked --dev --extra all

      - name: Run ruff check
        run: uv run ruff check --output-format=github

  format:
    name: Format check with ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --locked --dev --extra all

      - name: Run ruff format
        run: uv run ruff format --check

  test:
    name: Test with pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # The coverage comment step needs to write to the PR. Forks get a read-only token
      # regardless, which is why that step is continue-on-error.
      pull-requests: write

    strategy:
      matrix:
        # uv.lock carries a distinct resolution marker per minor, so 3.12 and 3.13 resolve
        # dependency graphs that 3.11 and 3.14 never exercise (REL-08).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    # No warehouse credentials: integration tests replay from committed ADBC
    # cassettes (tests/integration/cassettes/). Recording against real
    # warehouses is a local, credentialed step (pytest --adbc-record=once).

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # tests/unit/test_scope_fence.py diffs against a commit ~170 back, and the
          # default shallow clone of depth 1 does not carry it. Without this the path
          # half of the scope fence skipped on every CI run and reported the same green
          # as a fence that ran and found nothing. docs.yml and release.yml already
          # check out in full; the repo is small enough that the cost is noise.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --dev --extra all

      # Pre-install the DuckDB semantic_views community extension once so that
      # parallel pytest workers (-n auto) don't race on the user-level
      # ~/.duckdb/extensions/<version>/<platform>/ install lock. With the
      # extension already cached, INSTALL becomes a no-op inside each worker.
      - name: Warm DuckDB semantic_views extension cache
        run: |
          uv run python -c "
          import adbc_driver_duckdb.dbapi as duckdb_adbc
          con = duckdb_adbc.connect(':memory:')
          cur = con.cursor()
          cur.execute(\"INSTALL semantic_views FROM community\")
          cur.execute(\"LOAD semantic_views\")
          cur.close()
          con.close()
          "

      - name: Run unit tests with coverage
        run: |
          uv run pytest \
            --cov=src/semolina \
            --cov-report=xml \
            --cov-report=term \
            -n auto

      # Only reachable since the pull_request trigger was added. Two things were wrong
      # while it was dead code: `pytest-coverage-path` expects pytest-cov's *text* output,
      # so an XML file there produced no comment, and with a matrix it would post one
      # comment per interpreter. Fork PRs carry a read-only token and cannot comment at
      # all, so a failure here must not fail the run.
      - name: Post coverage comment
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        continue-on-error: true
        uses: MishaKav/pytest-coverage-comment@v1.11.0
        with:
          pytest-xml-coverage-path: coverage.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

      # No marker filter: `-m duckdb` skipped the three model-translation tests in
      # src/semolina_jaffle_shop/, so they ran under `just test` and never in CI. The
      # warehouse tests skip themselves when no credentials are present. Keep this in step
      # with the `test` recipe in the justfile (REL-05).
      - name: Test semolina-jaffle-shop
        run: |
          cd semolina-jaffle-shop
          uv run pytest

      - name: Prune cache
        if: always()
        run: uv cache prune --ci

  docs:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # CLAUDE.md lists `just docs-build` as a quality gate, but until 2026-09-07 the strict
    # build ran only in docs.yml, on push to main — so a broken cross-reference or a stale
    # autoapi target was found after merge, by the job that deploys the site, rather than on
    # the PR that introduced it (REL-04). Same command as docs.yml and the justfile recipe:
    # -W turns warnings into errors, and conf.py sets nitpicky = True.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # sphinx-autoapi reads src/semolina and conf.py derives the version from package
          # metadata; full history costs nothing here and keeps this identical to docs.yml.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync docs dependencies
        run: uv sync --locked --group docs

      - name: Build docs
        run: uv run sphinx-build -W docs/src docs/_build

  packaging-smoke:
    name: Smoke test clean-venv extras installs
    runs-on: ubuntu-latest
    # Observed at 13s with two venvs (run 31231284657); the third venv adds one small
    # wheel set, so 5 minutes stays a wide margin rather than a guess.
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install [duckdb] extra in clean venv
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python ".[duckdb]"

      - name: Import smoke test
        run: |
          /tmp/smoke-venv/bin/python -c "from semolina.engines.duckdb import DuckDBEngine; print('OK')"

      - name: Install base (no extras) in clean venv
        run: |
          uv venv /tmp/base-venv
          uv pip install --python /tmp/base-venv/bin/python "."

      - name: Base install pulls no anyio (ASYNC-04)
        run: |
          /tmp/base-venv/bin/python -c "import semolina, importlib.util; assert importlib.util.find_spec('anyio') is None, 'anyio present in a base install'; print('OK')"

      # DTO-05. Only a real extras-free venv can observe what a default install
      # contains: the unit suite runs with --extra all, and a find_spec monkeypatch
      # fakes the very observation being made. All four were measured absent here
      # before these assertions were written.
      - name: Base install pulls no arrowmodel (DTO-05)
        run: |
          /tmp/base-venv/bin/python -c "import semolina, importlib.util; assert importlib.util.find_spec('arrowmodel') is None, 'arrowmodel present in a base install'; print('OK')"

      - name: Base install pulls no polars (DTO-05)
        run: |
          /tmp/base-venv/bin/python -c "import semolina, importlib.util; assert importlib.util.find_spec('polars') is None, 'polars present in a base install'; print('OK')"

      - name: Base install pulls no pandas (DTO-05)
        run: |
          /tmp/base-venv/bin/python -c "import semolina, importlib.util; assert importlib.util.find_spec('pandas') is None, 'pandas present in a base install'; print('OK')"

      # pyarrow IS in sys.modules after `import semolina` in the dev venv, because
      # adbc_driver_manager.dbapi imports it opportunistically when present. It is not
      # a declared dependency of anything in the base tree, so a base install has no
      # pyarrow at all and the `_require("pyarrow", ...)` guards stay reachable. That
      # gap between the two observations is why this claim lives here and not in a test.
      - name: Base install pulls no pyarrow (DTO-05)
        run: |
          /tmp/base-venv/bin/python -c "import semolina, importlib.util; assert importlib.util.find_spec('pyarrow') is None, 'pyarrow present in a base install'; print('OK')"

      - name: Install [arrowmodel] extra in clean venv
        run: |
          uv venv /tmp/arrowmodel-venv
          uv pip install --python /tmp/arrowmodel-venv/bin/python ".[arrowmodel]"

      - name: The [arrowmodel] extra installs arrowmodel (DTO-05)
        run: |
          /tmp/arrowmodel-venv/bin/python -c "import importlib.util, semolina; assert importlib.util.find_spec('arrowmodel') is not None, 'arrowmodel missing from a [arrowmodel] install'; print('OK')"
